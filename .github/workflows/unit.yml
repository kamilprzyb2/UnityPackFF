name: Unit tests

# Offline tests on made-up data: every push to master and every pull
# request, whatever its base (stacked pull requests have pr/* bases).
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.15"]  # the oldest pyproject.toml allows, and the newest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[test]'
      - name: ImageMagick (for wand), if the runner lacks it
        run: python -c "import wand.image" || (sudo apt-get update && sudo apt-get install -y --no-install-recommends libmagickwand-dev)
      - run: pytest -rs
